{% extends "base.html" %}
{% block title %}Nuevo empleado{% endblock %}
{% block content %}
    <h2>Nuevo empleado</h2>
    <form method="POST">
        <label>Nombre: <input type="text" name="nombre" required></label><br>
        <label>Puesto: <input type="text" name="puesto" required></label><br>
        <label>Salario: <input type="number" step="0.01" name="salario" required></label><br>
        <label>Fecha de ingreso: <input type="date" name="fecha_ingreso"></label><br>
        <button type="submit">Guardar</button>
        <a href="{{ url_for('empleados.index') }}">Cancelar</a>
    </form>
{% endblock %}
