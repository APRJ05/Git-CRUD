{% extends "base.html" %}
{% block title %}Editar empleado{% endblock %}
{% block content %}
    <h2>Editar empleado</h2>
    <form method="POST">
        <label>Nombre:
            <input type="text" name="nombre" value="{{ empleado.nombre }}" required>
        </label><br>
        <label>Puesto:
            <input type="text" name="puesto" value="{{ empleado.puesto }}" required>
        </label><br>
        <label>Salario:
            <input type="number" step="0.01" name="salario" value="{{ empleado.salario }}" required>
        </label><br>
        <label>Fecha de ingreso:
            <input type="date" name="fecha_ingreso" value="{{ empleado.fecha_ingreso.strftime('%Y-%m-%d') }}">
        </label><br>
        <button type="submit">Actualizar</button>
        <a href="{{ url_for('empleados.index') }}">Cancelar</a>
    </form>
{% endblock %}
